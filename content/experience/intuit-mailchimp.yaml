    priority: 1

  - text: >-
      Modernized the file import pipeline with XLSX support, server-side file-size
      enforcement on cloud-stored uploads, and a new PATCH endpoint — shipped behind
      feature flags with fallback to the legacy flow for zero-disruption rollout.
    tags: [backend, api]
    priority: 1

  - text: >-
      Migrated anomaly detection off Data Service Fabric onto AISLE and surfaced
      industry data on the mobile API root response, modernizing the data path
      behind the iOS and Android apps.
    tags: [backend, api, data, migration]
    priority: 1

  - text: >-
      Expanded Playwright end-to-end coverage across critical account-management
